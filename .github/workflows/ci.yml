name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  # Keep in sync with minimum_zig_version in build.zig.zon.
  ZIG_VERSION: 0.16.0

jobs:
  build-and-test:
    # ocwatch is Linux-only by design: inotify, getdents64, statx.
    #
    # Both architectures run the whole suite rather than cross-compiling for
    # aarch64 and calling it covered. Most of what can break here — the wd map,
    # rebuilds after a directory move, the exit paths — only shows up against a
    # live kernel, and aarch64 is the architecture this is deployed on. A build
    # that merely links for the target would never exercise any of it.
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing must not cancel the other: which of the two
      # broke is the most useful thing to know.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Report toolchain and architecture
        run: |
          uname -m
          zig version
          zig targets | head -1 >/dev/null   # fail early if the toolchain is unusable

      - name: Check formatting
        run: zig fmt --check .

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Unit tests
        run: zig build test --summary all

      # Exercises the parts that only exist against a live kernel: recursive
      # watch setup, both halves of an atomic rename, watches added for
      # directories created after startup, the rebuild that follows a directory
      # move, and the exit paths taken when there is nothing left to watch.
      - name: Integration test
        run: ./tests/integration.sh
